<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only this app's own files, Google's Firebase scripts and Rachel herself. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://script.google.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Rachel</title>
  <!-- maximum-scale=1 stops iPhone zooming the whole app in when a text box is
       tapped (it does for any box under 16px) and leaving it zoomed - the main
       "moves around" complaint. Pinch-zoom still works (iOS ignores it for that). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6D7064">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rachel">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root { --bg: #6D7064; --card: #5B5D53; --gold: #F3E5AB; --text: #FFFFFF; --muted: #E5E5E5; --border: #7C7F72; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    /* The app itself never scrolls, bounces or shifts - only Rachel's own page
       inside the frame scrolls. Without this the whole app rubber-bands behind
       Rachel and the status-bar padding made it a few pixels taller than the
       screen, so it slid around under your thumb. */
    html, body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
    #rachel { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top); bottom: 0;
      width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; background: var(--bg); display: block; }
    .bar {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
      background: var(--card); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6); font-size: 15px; line-height: 1.4;
    }
    .bar[hidden] { display: none; }
    .bar strong { color: var(--gold); }
    .bar .row { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
    .bar button { font: inherit; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); }
    .bar button.go { background: var(--gold); color: #4B4D44; border: none; font-weight: 700; }
    #toast { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); z-index: 11;
      background: var(--card); border-left: 4px solid var(--gold); border-radius: 8px; padding: 10px 12px;
      font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
    #toast[hidden] { display: none; }
  </style>
</head>
<body>
  <iframe id="rachel" title="Rachel" allow="clipboard-write"></iframe>

  <div class="bar" id="installBar" hidden>
    <strong>Install Rachel</strong> to get pop-ups: tap the <strong>Share</strong> button in Safari,
    then <strong>Add to Home Screen</strong>, then open Rachel from the new icon.
    <div class="row"><button type="button" id="installDismiss">OK</button></div>
  </div>

  <div class="bar" id="pushBar" hidden>
    <strong>Turn on Rachel pop-ups?</strong> Reminders and your morning summary will pop up on this phone.
    <div class="row">
      <button type="button" id="pushLater">Not now</button>
      <button type="button" class="go" id="pushYes">Turn on</button>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
